[project]
name = "leo-resolve"
version = "0.0.0"
description = "Windows companion for DaVinci Resolve"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["PySide6>=6.11.2,<6.12"]

[dependency-groups]
dev = [
  "pyinstaller>=6.22.2,<7",
  "pytest>=8.4.2,<9",
  "pytest-qt>=4.5,<5",
  "ruff>=0.16.6,<1",
]

[build-system]
requires = ["hatchling>=1.32,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
qt_api = "pyside6"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
